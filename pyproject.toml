[project]
name = "au-weather-mcp"
version = "0.1.0"
description = "MCP server for Australian weather data from the Bureau of Meteorology"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Craig Penfold" }
]
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
au-weather-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "weather"]
